# CI — ตรวจคุณภาพโค้ดทุกครั้งที่ push และเปิด Pull Request
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------- job 1: lint + typecheck ----------
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  # ---------- job 2: ทดลอง build Docker image ----------
  docker-build:
    runs-on: ubuntu-latest
    needs: check # รันหลัง job check ผ่านเท่านั้น
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # NEXT_PUBLIC_* อ่านจาก Variables ของ repo (ถ้ายังไม่ตั้ง build ก็ยังผ่าน)
      - name: Build app image (runner)
        run: |
          docker build --target runner -t uchango-app:ci \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="${{ vars.NEXT_PUBLIC_SUPABASE_URL }}" \
            --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}" \
            .

      - name: Show image size
        run: docker images uchango-app:ci
