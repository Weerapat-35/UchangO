# SonarQube settings for the Ouchang garage project.
# Place this file in the project root (the folder that contains package.json).

sonar.projectKey=Ouchang-Garage
sonar.projectName=Ouchang Garage

# Scan only the application source code
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Skip generated files, dependencies and backups
sonar.exclusions=**/node_modules/**,**/.next/**,**/*.bak,**/*.backup,**/*.generated.*

# Local SonarQube server (started by run-sonar.ps1)
sonar.host.url=http://localhost:9000
