# Nginx reverse proxy สำหรับ uchango-garage.tech
#
# ติดตั้งบน VPS (root):
#   cp ~/uchango/nginx.conf /etc/nginx/sites-available/uchango
#   ln -s /etc/nginx/sites-available/uchango /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   (ถ้า VPS ไม่มีเว็บอื่นใช้ไฟล์ default อยู่ ลบได้: rm /etc/nginx/sites-enabled/default)
#
# HTTPS: certbot --nginx -d uchango-garage.tech -d www.uchango-garage.tech --redirect
#        (certbot จะแก้ไฟล์บน VPS เพิ่ม listen 443 และ redirect ให้เอง)

server {
    # รับ HTTP ทั้ง IPv4 และ IPv6
    listen 80;
    listen [::]:80;
    server_name uchango-garage.tech www.uchango-garage.tech;

    # อนุญาตอัปโหลดรูปรถ/สลิปขนาดไม่เกิน 10 MB
    client_max_body_size 10m;

    location / {
        # ส่งต่อให้แอปใน Docker (APP_PORT=127.0.0.1:3301 ใน .env)
        proxy_pass http://127.0.0.1:3301;
        proxy_http_version 1.1;
        # ส่งชื่อโดเมน, IP จริงของผู้ใช้ และ http/https ไปให้แอป
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
